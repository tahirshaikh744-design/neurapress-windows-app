<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; style-src 'unsafe-inline'; img-src 'self' file:; font-src 'self' file:" />
<link rel="stylesheet" href="vendor/fonts.css" />
<title>NEURAPRESS</title>
<style>
  html, body {
    width: 540px;
    height: 360px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  .splash {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background:
      radial-gradient(120% 130% at 18% -12%, rgba(0,224,255,0.20) 0%, rgba(0,224,255,0.04) 42%, transparent 60%),
      radial-gradient(110% 120% at 105% 112%, rgba(124,92,255,0.22) 0%, rgba(124,92,255,0.05) 45%, transparent 62%),
      linear-gradient(160deg, #060b14 0%, #0a1322 58%, #070d18 100%);
    border: 1px solid rgba(77,231,255,0.22);
    box-shadow: inset 0 0 46px rgba(0,224,255,0.06), 0 0 34px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
  }
  .grid {
    position: absolute;
    inset: 0;
    opacity: 0.35;
    background-image:
      radial-gradient(rgba(77,231,255,0.16) 1px, transparent 1.4px),
      linear-gradient(rgba(77,231,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,231,255,0.05) 1px, transparent 1px);
    background-size: 22px 22px, 44px 44px, 44px 44px;
    border-radius: 18px;
    pointer-events: none;
  }
  .emblem {
    width: 158px;
    height: 158px;
    filter: drop-shadow(0 6px 22px rgba(0,224,255,0.35));
    animation: spinGlow 3.2s ease-in-out infinite;
  }
  @keyframes spinGlow {
    0%, 100% { filter: drop-shadow(0 6px 22px rgba(0,224,255,0.35)); transform: rotate(0deg) scale(1); }
    50%      { filter: drop-shadow(0 6px 34px rgba(0,224,255,0.55)); transform: rotate(1.5deg) scale(1.035); }
  }
  .wordmark {
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 3px;
    margin-top: 14px;
    background: linear-gradient(90deg, #9ef2ff 0%, #4de7ff 34%, #7ccfff 66%, #b29bff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 26px rgba(0,224,255,0.45);
  }
  .subtitle {
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 5.5px;
    color: #6fe3ff;
    margin-top: 4px;
    text-transform: uppercase;
  }
  .track {
    width: 280px;
    height: 4px;
    margin-top: 26px;
    border-radius: 999px;
    background: rgba(77,231,255,0.10);
    border: 1px solid rgba(77,231,255,0.16);
    overflow: hidden;
    position: relative;
  }
  .bar {
    height: 100%;
    width: 42%;
    border-radius: 999px;
    background: linear-gradient(90deg, #4de7ff, #b29bff);
    box-shadow: 0 0 12px rgba(0,224,255,0.8);
    animation: sweep 1.15s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(340%); }
  }
  .status {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 2.4px;
    color: #b7d4e5;
    text-transform: uppercase;
  }
  .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    margin-right: 8px;
    background: #4de7ff;
    vertical-align: middle;
    animation: blink 1.1s steps(2, start) infinite;
    box-shadow: 0 0 8px rgba(0,224,255,0.9);
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .fine {
    position: absolute;
    bottom: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 1.6px;
    color: #8fb6cb;
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="grid"></div>
    <img class="emblem" src="build/splash_emblem.png" alt="" draggable="false" />
    <div class="wordmark">NEURAPRESS</div>
    <div class="subtitle">Quantum PDF Compressor</div>
    <div class="track"><div class="bar"></div></div>
    <div class="status"><span class="dot"></span>Initializing Quantum Engine</div>
    <div class="fine">LOCAL · OFFLINE · ZERO-UPLOAD</div>
  </div>
</body>
</html>
